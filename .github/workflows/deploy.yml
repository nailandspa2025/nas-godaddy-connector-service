name: Build, Push & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nas-godaddy-connector-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nas-godaddy-connector-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-push-deploy
    steps:
      # In ra lý do SSH lỗi cụ thể (không in nội dung secret)
      - name: Diagnose SSH secrets
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.GCP_SERVER_HOST }}
          SSH_USER: ${{ secrets.GCP_SERVER_USER }}
          SSH_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        run: |
          check() { if eval "$2"; then echo "OK    $1"; else echo "FAIL  $1"; fi; }
          echo "=== Secrets ==="
          check "GCP_SERVER_HOST is set"                 '[ -n "$SSH_HOST" ]'
          check "GCP_SERVER_HOST == 34.28.35.249"        '[ "$SSH_HOST" = "34.28.35.249" ]'
          check "GCP_SERVER_USER is set"                 '[ -n "$SSH_USER" ]'
          check "GCP_SERVER_USER == salesusa"            '[ "$SSH_USER" = "salesusa" ]'
          check "GCP_SERVER_USER has no spaces/newlines" '! printf %s "$SSH_USER" | grep -q "[[:space:]]"'
          check "GCP_SERVER_USER is not an email"        '! printf %s "$SSH_USER" | grep -q @'
          echo "GCP_SERVER_USER length: ${#SSH_USER}"
          check "GCP_SSH_PRIVATE_KEY is set"             '[ -n "$SSH_KEY" ]'
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          check "Key starts with -----BEGIN"             'head -1 /tmp/deploy_key | grep -q "^-----BEGIN .*PRIVATE KEY-----$"'
          check "Key ends with -----END"                 'grep -q "^-----END .*PRIVATE KEY-----$" /tmp/deploy_key'
          check "Key is not a public key (.pub)"         '! grep -q "^ssh-" /tmp/deploy_key'
          check "Key has no passphrase / is parseable"   'ssh-keygen -y -P "" -f /tmp/deploy_key >/dev/null 2>&1'
          echo "Key lines: $(wc -l < /tmp/deploy_key)"
          echo "Key fingerprint (so với server: ssh-keygen -lf ~/.ssh/authorized_keys):"
          ssh-keygen -lf /tmp/deploy_key 2>&1 || true
          echo "=== SSH login test ==="
          ssh -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -v \
            "$SSH_USER@$SSH_HOST" 'echo LOGIN_OK as $(whoami); docker ps --format "{{.Names}}" | head -3' 2>&1 \
            | grep -E "LOGIN_OK|Connecting to|Connection established|Remote protocol|Offering public key|Server accepts key|Authentications that can continue|Permission denied|Authenticated to|Connection refused|timed out|Invalid|^[a-z-]+$" || true
          rm -f /tmp/deploy_key

      - name: SSH into Server & Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_SERVER_HOST }}
          username: ${{ secrets.GCP_SERVER_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

          # .env và private key Poynt lấy từ GitHub Secrets (CONNECTOR_ENV, POYNT_PRIVATE_KEY_PEM),
          # ghi ra server mỗi lần deploy — không nằm trong image, không cần tạo tay trên server.
          script: |
            set -e
            APP_DIR="$HOME/nas/godaddy-connector"
            mkdir -p "$APP_DIR/keys" "$APP_DIR/data"
            umask 077
            cat > "$APP_DIR/.env" <<'CONNECTOR_ENV_EOF'
            ${{ secrets.CONNECTOR_ENV }}
            CONNECTOR_ENV_EOF
            cat > "$APP_DIR/keys/private.pem" <<'POYNT_KEY_EOF'
            ${{ secrets.POYNT_PRIVATE_KEY_PEM }}
            POYNT_KEY_EOF
            # bỏ thụt đầu dòng (nếu có) do YAML
            sed -i 's/^[[:space:]]*//' "$APP_DIR/.env" "$APP_DIR/keys/private.pem"
            chmod 644 "$APP_DIR/keys/private.pem"
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/nas-godaddy-connector-service:${{ github.sha }}
            docker network inspect nas-net >/dev/null 2>&1 || docker network create nas-net
            docker stop nas-godaddy-connector-service || true
            docker rm nas-godaddy-connector-service || true
            docker run -d --restart=always --name nas-godaddy-connector-service --network nas-net -p 6009:6009 \
              --env-file "$APP_DIR/.env" \
              -e PORT=6009 \
              -e POYNT_PRIVATE_KEY_PATH=./keys/private.pem \
              -v "$APP_DIR/keys:/app/keys:ro" \
              -v "$APP_DIR/data:/app/data" \
              ghcr.io/${{ github.repository_owner }}/nas-godaddy-connector-service:${{ github.sha }}
            sleep 3
            docker logs --tail 5 nas-godaddy-connector-service
            curl -fsS localhost:6009/health && echo " <- health OK"
