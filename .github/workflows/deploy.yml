name: Build, Push & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nas-godaddy-connector-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nas-godaddy-connector-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-push-deploy
    steps:
      - name: SSH into Server & Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_SERVER_HOST }}
          username: ${{ secrets.GCP_SERVER_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

          # Trên server cần sẵn: /opt/nas/godaddy-connector/.env và keys/private.pem (xem README)
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/nas-godaddy-connector-service:${{ github.sha }}
            docker network inspect nas-net >/dev/null 2>&1 || docker network create nas-net
            mkdir -p /opt/nas/godaddy-connector/keys /opt/nas/godaddy-connector/data
            docker stop nas-godaddy-connector-service || true
            docker rm nas-godaddy-connector-service || true
            docker run -d --restart=always --pull=always --name nas-godaddy-connector-service --network nas-net -p 6009:6009 \
              --env-file /opt/nas/godaddy-connector/.env \
              -e PORT=6009 \
              -v /opt/nas/godaddy-connector/keys:/app/keys:ro \
              -v /opt/nas/godaddy-connector/data:/app/data \
              ghcr.io/${{ github.repository_owner }}/nas-godaddy-connector-service:${{ github.sha }}
